<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:860}}">
const SNAKE_PHOTO = (window.__resources || {}).snakePhoto || "assets/snake-photo-wide.jpg";
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { thread: [], turn: null, inputValue: "", intent: null, species: null, idMethod: null, severity: null, tmin: 34,
      isVictim: true, hospital: "Mbabane Government Hospital", hasNeuro: false, selectedSymptoms: [], checkSel: {}, hasLoc: false,
      seamA: false, seamB: false, keyStep: 0, keyAnswers: [], biteTime: null, symId: null, swell: false };
  }
  componentDidMount(){ this.enter("welcome", true); }
  componentDidUpdate(){ const el = document.getElementById("wa-scroll"); if (el) el.scrollTop = el.scrollHeight; }

  // ---------- palette ----------
  static ALERT_BODY = "It\u2019s time to check your symptoms, can you answer a few questions?";
  static PROTO_NOTE = "Elapsed time = species symptom check interval. If victim is waiting for transportation or en route, this might be a good time to collect missing information.";
  static fmt12(mins){ const H = Math.floor(mins/60), M = mins%60;
    return (((H+11)%12)+1) + ":" + String(M).padStart(2,"0") + (H<12 ? "am" : "pm"); }
  static C = { navy:"#11344F", verm:"#C94B30", teal:"#447687", bronze:"#A0713F", green:"#008069",
    inBg:"#ffffff", outBg:"#d9fdd3", txt:"#111b21", meta:"#667781", tick:"#53bdeb" };

  clock(){ const m = this.state.tmin; const h = 14; return h + ":" + String(m).padStart(2,"0"); }

  // ---------- flow entry ----------
  enter(id, initial){
    const built = this.buildState(id);
    this.setState(s => {
      let thread = initial ? [
        { t:"sys", text:"Messages are end-to-end encrypted. SnakeIQ never sees this thread until you send." },
        { t:"day" },
        { t:"user", text:"Help \u2014 snake!" }
      ] : s.thread.slice();
      thread = thread.concat(built.msgs);
      if (built.iact) thread.push(built.iact);
      const next = { thread, turn: built.turn };
      if (built.iact && built.iact.reset) next.checkSel = {};
      return next;
    });
    // out-of-session symptom alert fires after hospital directions
    if (id === "idkey") this.setState({ seamA: true });
    if (id === "species_results") this.setState({ seamB: true });
    if (id === "hospital_directions") setTimeout(()=>this.enter("symptom_alert"), 1400);
  }

  pick(msg, action){
    // freeze the tapped interactive
    this.setState(s => {
      const thread = s.thread.map(m => m === msg ? { ...m, done:true, picked: action.title } : m);
      const echo = ("echo" in action) ? action.echo : action.title;
      if (echo) thread.push({ t:"user", text: echo });
      return { thread, tmin: Math.min(59, s.tmin) };
    });
    if (action.url || action.next === "__none") return;
    // special sequences
    if (action.next === "__photo"){
      this.setState({ idMethod: "photo" });
      setTimeout(()=>{
        this.setState(s=>({ thread: s.thread.concat([{ t:"userphoto" }]) }));
        // location is asked while the image is being analysed — but only once per session
        if (this.state.hasLoc){
          setTimeout(()=>{
            this.setState(s=>({ thread: s.thread.concat([{ t:"note", text:"Analyzing the image\u2026 this may take a minute." }]) }));
            setTimeout(()=>this.enter("species_results"), 1100);
          }, 500);
        } else setTimeout(()=>this.enter("loc_photo"), 500);
      }, 250);
      return;
    }
    if (msg && msg.kind === "location") this.setState({ hasLoc: true });
    if (action.species) this.setState({ species: action.species });
    if (action.intent) this.setState({ intent: action.intent });
    if (action.method) this.setState({ idMethod: action.method });
    if (action.method === "key"){
      this.setState({ seamA: true, keyStep: 0, keyAnswers: [] });
      // hand the module everything Design already knows; it seeds its own candidate set
      this.eng = ID().createSession(this.seamAPayload());
    }
    if (action.severity) this.setState({ severity: action.severity });
    if (action.sym) this.setState({ symId: action.sym });
    if (action.isVictim !== undefined) this.setState({ isVictim: action.isVictim });
    if (action.hospital) this.setState({ hospital: action.hospital });
    if (action.neuro) this.setState({ hasNeuro: true });
    if (action.swell !== undefined) this.setState({ swell: action.swell });
    if (action.symptoms) this.setState({ selectedSymptoms: action.symptoms });
    if (action.biteTime) this.setState({ biteTime: action.biteTime });
    if (action.keyAnswer && this.eng){
      const a = action.keyAnswer, m = ID();
      m.answer(this.eng, a.questionId, a.answer);
      this.setState(s=>({ keyAnswers: s.keyAnswers.concat([a]), keyStep: s.keyStep + 1 }));
      if (!m.nextQuestion(this.eng)){
        // module has terminated: one dominant candidate -> confirmation card, several -> carousel
        const r = m.result(this.eng);
        this.setState({ seamB: true });
        if (r.selectedSpeciesId || r.candidates.length === 1){
          this.setState({ species: r.selectedSpeciesId || r.candidates[0].speciesId });
          action.next = "confirm";
        } else action.next = "species_results";
      }
    }
    setTimeout(()=>this.enter(action.next), 260);
  }

  inputHint(){
    const live = this.state.thread.filter(m=>m.t==="iact" && !m.done);
    const last = live[live.length-1];
    if (last){
      if (last.data && last.data.hint) return last.data.hint;
      if (last.data && last.data.rows && last.data.rows.some(r=>r.typeSpecies))
        return "Type: \u201cblack mamba\u201d\u2026";
      if (last.data && last.data.rows && last.data.rows.some(r=>r.typeHere))
        return "Type: \u201cwaiting for an ambulance\u2026\u201d";
    }
    return "Type \u201csnake catcher\u201d\u2026";
  }



  sendTyped(){
    const v = (this.state.inputValue||"").trim();
    if (!v) return;
    this.setState(s=>({ thread: s.thread.concat([{ t:"user", text:v }]), inputValue:"" }));
    const last = [...this.state.thread].reverse().find(m=>m.t==="iact");
    // a list offering "type what is happening" accepts free text directly
    if (last && !last.done && last.kind === "list" && last.data && last.data.rows &&
        last.data.rows.some(r=>r.typeHere)){
      this.setState(s=>({ thread: s.thread.map(m=> m===last ? { ...m, done:true } : m) }));
      setTimeout(()=>this.setState(s=>({ thread: s.thread.concat([{ t:"bot", text:"Thank you \u2014 a SnakeIQ responder will follow up to make sure you\u2019re ok." }]) })), 320);
      return;
    }
    if (last && !last.done && last.kind === "list" && last.data && last.data.rows &&
        last.data.rows.some(r=>r.typeSpecies)){
      const key = this.matchSpecies(v);
      if (key){
        this.setState(s2=>({ thread: s2.thread.map(m=> m===last ? { ...m, done:true } : m), species:key, seamB:true }));
        setTimeout(()=>this.enter("confirm"), 320); return;
      }
    }
    if (last && last.data && last.data.awaitText){
      if (last.data.biteClock){
        const t = this.parseClock(v);
        if (t === null){
          setTimeout(()=>this.setState(s2=>({ thread: s2.thread.concat([{ t:"bot", text:"I didn\u2019t catch a time. Reply like 2:15pm." }]) })), 320);
          return;
        }
        const ago = Math.max(0, CHAT_START_MIN - t);
        const bucket = ago < 5 ? "t_lt5" : ago < 15 ? "t_5_15" : ago < 60 ? "t_15_60" : ago < 360 ? "t_1_6h" : "t_gt6h";
        this.setState(s2=>({ thread: s2.thread.map(m=> m===last ? { ...m, done:true } : m),
          biteTime:{ id:bucket, label:Component.fmt12(t), minutesBeforeChat:ago } }));
        setTimeout(()=>this.enter(last.data.next), 320);
        return;
      }
      if (last.data.speciesName){
        this.setState(s=>({ thread: s.thread.map(m=> m===last ? { ...m, done:true } : m) }));
        const key = this.matchSpecies(v);
        if (key){ this.setState({ species:key, seamB:true }); setTimeout(()=>this.enter("confirm"), 320); }
        else setTimeout(()=>this.setState(s=>({ thread: s.thread.concat([{ t:"bot", text:"I don\u2019t know that name. Let\u2019s go back to the description questions." }]) }), ()=>this.enter("idkey")), 320);
        return;
      }
      if (last.data.hospital){
        this.setState({ hospital: v });
        setTimeout(()=>this.enter("sc_hosp_confirm"), 320); return;
      }
      if (last.data.other){
        setTimeout(()=>this.setState(s=>({ thread: s.thread.concat([{ t:"bot", text:"Thank you \u2014 a SnakeIQ responder will follow up to make sure you\u2019re ok." }]) })), 320);
        return;
      }
      setTimeout(()=>this.enter("sc_meds_warn"), 320); return;
    }
    if (/snake\s*catcher|catcher/i.test(v)){ setTimeout(()=>this.enter("catcher_list"), 260); return; }
    const key = this.matchSpecies(v);
    if (key){ this.setState({ species:key, idMethod:"text" }); setTimeout(()=>this.enter("confirm"), 300); return; }
    setTimeout(()=>this.setState(s=>({ thread: s.thread.concat([{ t:"bot", text:"Tap one of the buttons above so I can help you fastest." }]) })), 300);
  }

  parseClock(v){
    const m2 = String(v).toLowerCase().match(/(\d{1,2})\s*[:.h]?\s*(\d{2})?\s*(am|pm)?/);
    if (!m2) return null;
    let H = parseInt(m2[1],10), M = m2[2] ? parseInt(m2[2],10) : 0;
    if (H > 23 || M > 59) return null;
    const ap = m2[3];
    if (ap === "pm" && H < 12) H += 12;
    if (ap === "am" && H === 12) H = 0;
    let t = H*60 + M;
    if (!ap && H < 12 && t + 720 <= CHAT_START_MIN) t += 720;   // nearest past time
    if (t > CHAT_START_MIN) t -= 720;                            // afternoon implied
    if (t > CHAT_START_MIN || t < 0) t = CHAT_START_MIN;
    return t;
  }

  matchSpecies(v){
    const s = v.toLowerCase();
    if (/mamba|dendroaspis/.test(s)) return "mamba_black";
    if (/cobra|naja/.test(s)) return "cobra_mozam";
    if (/puff|adder|bitis/.test(s)) return "adder_puff";
    if (/python/.test(s)) return "python_southern";
    return null;
  }

  // ---------- seams ----------
  symId(){
    const M = { critical:"sym_breath", neuro:"sym_ptosis", systemic:"sym_dizzy",
      spread:"sym_spread", local:"sym_local", none:"sym_none" };
    return this.state.symId || M[this.state.severity] || null;
  }

  // Seam A — Design → module. Emitted when "ID snake by description" is chosen.
  seamAPayload(){
    const sym = this.symId();
    const payload = { sessionId: SESSION_ID, channel:"whatsapp", entryPoint:"id_by_description",
      victim:"self",
      location:{ lat:-26.3167, lng:31.1333, source:"device", label:"Manzini, Eswatini" },
      // Omitted entirely on the ID-only path: triage never ran, so there is nothing to assert.
      // Buckets and ids only — no derived minute count. Interpreting elapsed time is the module's job.
      syndromicPriors: sym
        ? { primarySymptom: sym,
            timeSinceBite: this.state.biteTime ? this.state.biteTime.id : null,
            rawAnswers:[{ questionId:"snakeiq_symptoms", answer: sym }]
              .concat(this.state.biteTime ? [{ questionId:"snakeiq_bite_time", answer:this.state.biteTime.id }] : []) }
        : null };
    if (!sym) delete payload.syndromicPriors;
    return payload;
  }
  // Seam B — module → Design. Design renders it; it never derives any of it.
  seamBPayload(){
    const m = ID(); if (!m) return {};
    const bt = this.state.biteTime ? this.state.biteTime.id : null;
    const elapsed = (bt && m.ELAPSED[bt] !== undefined) ? m.ELAPSED[bt] : 0;
    const mk = (id, conf) => { const s = m.byId(id);
      return { speciesId:s.speciesId, commonName:s.commonName, scientificName:s.scientificName,
        confidence:conf, venomStatus:s.venomStatus, venomStatusLabel:s.venomStatusLabel,
        syndromeClass:s.syndromeClass, antivenom:s.antivenom, alertIntervalMin:s.alertIntervalMin,
        cadenceBasis:s.cadenceBasis, firstAid:s.firstAid, careLevel:s.careLevel, tier:s.tier, notes:s.notes }; };
    let base;
    if (this.state.idMethod === "key" && this.eng){
      base = m.result(this.eng);
      base.source = "adaptive_key";
    } else {
      base = { sessionId: SESSION_ID, confirmed:false, selectedSpeciesId:null,
        candidates: MOCK_PHOTO_MATCHES.map(x=>mk(x[0], x[1])),
        caseContext:{ primarySymptom:this.symId(), timeSinceBite:bt, victim:"self",
          location:{ lat:-26.3167, lng:31.1333, label:"Manzini, Eswatini" } },
        firstCheckDueMin:null, source:"photo_match", handBackTo:"find_antivenom" };
    }
    if (this.state.species){
      const sel = base.candidates.filter(c=>c.speciesId === this.state.species)[0] || mk(this.state.species, null);
      base = { ...base, confirmed:true, selectedSpeciesId:sel.speciesId, candidates:[sel],
        firstCheckDueMin: Math.max(0, sel.alertIntervalMin - elapsed) };
    } else if (base.firstCheckDueMin === null && base.candidates.length){
      base.firstCheckDueMin = Math.max(0, base.candidates[0].alertIntervalMin - elapsed);
    }
    return base;
  }

  // ---------- twilio payload builders ----------
  mkChecks(list){ return list.map(x => ({ ...x, ok: x.len <= x.limit })); }

  buildState(id){

      case "loc_photo": {

      case "eye_directions": return {
        msgs: [],
        iact: { t:"iact", kind:"card", data:{ map:true, title:"Mbabane Government", body:"8 km \u00b7 ~14 min by car. Eye casualty on site \u2014 no antivenom required.", tag:null },

            "A photo is the best ID, so both photo routes are offered first and the no-photo case is a single honest exit rather than a buried fallback. The distance warning sits in the body rather than on the button, where there is no room for it: the instruction that keeps someone safe cannot be the thing that gets truncated.") ] }

      case "no_photo": {

        const body = "No problem. I can ID it from a description, or go straight to finding care.";
        const acts = [{ title:"ID snake by description", method:"key", next:"idkey" }]

          turn: { title:"No photo" + (bitten ? "" : " \u00b7 no-bite intent"), payloads:[ this.qr("snakeiq_no_photo" + (bitten ? "" : "_nobite"),
            body, btns, "IS","\u2014",
            (bitten
              ? "\u201cSkip for now, find antivenom\u201d is 28 characters \u2014 still over the quick-reply limit, so this turn ships as a list-picker (24-char title + description) on the real channel."
              : "No bite reported, so the antivenom shortcut is withheld: this path must end at species information or a snake catcher. Sending it here would put a person who was never bitten on the facility list and start the symptom-check timer.")) ] }
        };
      }

      // Adaptive key — the module chooses the node, the wording, the options and the
      // component. Design renders the object and posts the chosen value back.
      case "idkey": {
        const m = ID();
        const q = (m && this.eng) ? m.nextQuestion(this.eng) : null;
        if (!q) return this.buildState("species_results");
        const label = "ID key \u00b7 " + q.questionId + " (module step " + q.step + ")";
        const note = "Module-owned adaptive key. The engine chose this node because it discriminates among the "
          + q.liveCandidates + " candidates still live (split gain " + q.gain
          + "); nodes that cannot change the ranking are skipped, which is why the key is short. Component follows the option count: "
          + q.options.length + " \u2192 " + q.inputType + ". Priors reweight, never eliminate \u2014 a deadly species keeps a floor while the description stays ambiguous.";
        const lbl = (o)=> (KEY_LABEL[q.questionId] && KEY_LABEL[q.questionId][o.value]) || o.label;
        if (q.inputType === "list_picker"){
          const TYPE_ROW = ["I know the species","I can tell you the name of the species right now (type below)","key_type_species"];
          const first = !this.typeRowShown;
          if (first) this.typeRowShown = true;
          const rows = q.options.map(o=>(
            { title:lbl(o), desc:"", next:"idkey", echo:lbl(o), vis:keyVisual(q.questionId, o.value),

          const plRows = q.options.map(o=>[lbl(o), "", o.value]);
          if (first) plRows.push(TYPE_ROW);
          const kb = KEY_BUTTON.hasOwnProperty(q.questionId) ? KEY_BUTTON[q.questionId] : q.button;
          return {

        return {
          msgs: [{ t:"bot", text:q.prompt }],
          iact: { t:"iact", kind:"qr", actions: q.options.map(o=>(

          turn: { title:label, payloads:[ this.qr("snakeiq_"+q.questionId, q.prompt,

        ]}},

          hbody, "Choose hospital",

          "8 km \u00b7 ~14 min by car. Antivenom confirmed in stock.", [["Open in Google Maps","https://maps.google.com/?q=Mbabane+Government+Hospital","URL"]]) ] }
      };

        return {

        return {

          turn: { title:"Non-venomous ID overridden by symptoms", payloads:[ this.qr("snakeiq_nv_positive", body,
            [["Find hospital","nv_hosp"]], "IS","\u2014",

        };

      case "nv_wound_care": {

        return {
          msgs: [{ t:"bot", text:body }],
          iact: { t:"iact", kind:"qr", actions:[{ title:"Symptoms have started", next:"nv_symptoms" }]},
          turn: { title:"Non-venomous bite \u00b7 wound care (terminal)", payloads:[ this.qr("snakeiq_nv_wound_care", body,
            [["Symptoms have started","nv_recheck"]], "IS","\u2014",
            "Terminal, but re-enterable: the screen can be run again at any point, because envenoming can declare itself hours later.") ] }
        };
      }

      case "more_about": return {
        msgs: [{ t:"bot", text:sp.name+" ("+sp.sci+"). "+sp.about }],
        iact: { t:"iact", kind:"qr", actions:[{ title:"Contact snake catcher", next:"catcher_list" }]},
        turn: { title:"Species info", payloads:[ this.qr("snakeiq_species_info",
          sp.name+" ("+sp.sci+"). "+sp.about, [["Contact snake catcher","catcher"]], "IS","\u2014") ] }
      };

      case "catcher_list": return {
        msgs: [{ t:"bot", text:"Registered snake catchers near you. Tap to call \u2014 the number opens directly." }],
        iact: { t:"iact", kind:"list", data:{ map:false, button:"View catchers", rows:[
          { title:"Bheki Dlamini", desc:"Manzini \u00b7 +268 7612 3456", next:"catcher_done", echo:"Bheki Dlamini" },
          { title:"Thandi Nkosi", desc:"Mbabane \u00b7 +268 7698 7654", next:"catcher_done", echo:"Thandi Nkosi" },
          { title:"Sipho Maseko", desc:"Big Bend \u00b7 +268 7655 1122", next:"catcher_done", echo:"Sipho Maseko" }
        ]}},
        turn: { title:"Snake catcher directory (list-picker)", payloads:[ this.list("snakeiq_catchers",
          "Registered snake catchers near you. Tap to call \u2014 the number opens directly.", "View catchers",
          [["Bheki Dlamini","Manzini \u00b7 +268 7612 3456","catcher_bheki"],
           ["Thandi Nkosi","Mbabane \u00b7 +268 7698 7654","catcher_thandi"],
           ["Sipho Maseko","Big Bend \u00b7 +268 7655 1122","catcher_sipho"]],
          false, true) ] }
      };

      case "catcher_done": return {
        msgs: [{ t:"bot", text:"Calling now. Stay on the line and keep your distance from the snake until help arrives." }],
        iact: null,
        turn: { title:"Catcher connect", payloads:[ this.text("snakeiq_catcher_call",
          "Calling now. Stay on the line and keep your distance from the snake until help arrives.", "IS","\u2014") ] }
      };

      case "symptom_alert": return {
        msgs: [{ t:"pnote", text: Component.PROTO_NOTE }],
        iact: { t:"iact", kind:"qr", data:{ oos:true }, actions:[
          { title:"OK", next:"bite_time" },
          { title:"Not now", next:"sc_dismissed" }
        ]},
        turn: { title:"S-0 Symptom check alert \u00b7 currentStep 9.1", payloads:[ this.qrTmpl("snakeiq_sc_alert",
          Component.ALERT_BODY,
          [["OK","sc_alert_ok"],["Not now","sc_alert_later"]],
          {}) ] }
      };

      // S-1 dismissed
      case "sc_dismissed": return {
        msgs: [{ t:"bot", text:"I\u2019ll check back with you later." }],
        iact: null,
        turn: { title:"S-1 Alert dismissed \u2014 flow ends", payloads:[ this.text("snakeiq_sc_dismissed",
          "I\u2019ll check back with you later.", "IS","\u2014") ] }
      };

      // S-3 en-route status
      case "sc_enroute": {
        const body = "Are you still on your way to "+this.state.hospital+" or have plans changed?";
        return {
          msgs: [{ t:"bot", text:body }],
          iact: { t:"iact", kind:"qr", actions:[
            { title:"Still on my way", next:"sc_symptoms" },
            { title:"Different hospital", next:"sc_hosp_list" },
            { title:"Plans have changed", next:"sc_edge" }
          ]},
          turn: { title:"S-3 En-route status \u00b7 currentStep 10", payloads:[ this.qrTmpl("snakeiq_sc_enroute",
            "Are you still on your way to {{1}} or have plans changed?",
            [["Still on my way","sc_enroute_yes"],["Different hospital","sc_enroute_change"],["Plans have changed","sc_enroute_stop"]],
            { "1": this.state.hospital }) ] }
        };
      }

      // S-3b hospital change
      case "sc_hosp_list": return {
        msgs: [{ t:"bot", text:"Which one?" }],
        iact: { t:"iact", kind:"list", data:{ map:true, button:"Choose hospital", rows:[
          { title:"Mbabane Government", desc:"8.7 km \u00b7 142 vials \u00b7 +268 2404 2423", hospital:"Mbabane Government Hospital", next:"sc_symptoms", echo:"Mbabane Government Hospital" },
          { title:"Raleigh Fitkin Memorial", desc:"12.4 km \u00b7 86 vials \u00b7 +268 2505 2211", hospital:"Raleigh Fitkin Memorial Hospital", next:"sc_symptoms", echo:"Raleigh Fitkin Memorial Hospital" },
          { title:"A different hospital", desc:"Type the name of the facility", next:"sc_hosp_custom", echo:"A different hospital" }
        ]}},
        turn: { title:"S-3b Hospital list \u00b7 currentStep 10.5", payloads:[ this.list("snakeiq_sc_hospital",
          "Which one?", "Choose hospital",
          [["Mbabane Government","8.7 km \u00b7 142 vials \u00b7 +268 2404 2423","sc_hosp_mbabane"],
           ["Raleigh Fitkin Memorial","12.4 km \u00b7 86 vials \u00b7 +268 2505 2211","sc_hosp_rfm"],
           ["A different hospital","Type the name of the facility","sc_hosp_other"]],
          true) ] }
      };

      case "sc_hosp_custom": return {
        msgs: [{ t:"bot", text:"What is the name of the hospital you are going to?" }],
        iact: { t:"iact", kind:"await", data:{ awaitText:true, hospital:true, hint:"Type the hospital name\u2026" }},
        turn: { title:"S-3b Custom hospital text \u00b7 currentStep 10.6", payloads:[ this.text("snakeiq_sc_hosp_custom",
          "What is the name of the hospital you are going to?", "IS","\u2014") ] }
      };

      case "sc_hosp_confirm": {
        const name = this.state.hospital;
        const body = "14.1 km \u00b7 ~24 min by car\n48 vials in stock\n+268 2437 1180\n\nIs this the right facility?";
        return {
          msgs: [],
          iact: { t:"iact", kind:"card", data:{ map:true, title:name, body, tag:null },
            actions:[{ title:"Yes", echo:"Yes", next:"sc_symptoms" }]},
          turn: { title:"S-3b Custom hospital confirm \u00b7 currentStep 10.7", payloads:[ this.card("snakeiq_sc_hosp_confirm",
            name, body, [["Yes","sc_hosp_confirm_yes","QUICK_REPLY"]], {}) ] }
        };
      }

      case "sc_edge": return {
        msgs: [{ t:"bot", text:"What has changed?" }],
        iact: { t:"iact", kind:"list", data:{ map:false, button:"Choose an option", rows:[
          { title:"False alarm", desc:"Cancel the hospital notification", next:"sc_false_alarm", echo:"False alarm, cancel hospital notification" },
          { title:"Treating at home", desc:"Giving treatment at home", next:"sc_home_care", echo:"Giving treatment at home" },
          { title:"Other", desc:"Type what is happening", next:"sc_other", echo:"Other", noChevron:true, typeHere:true }
        ]}},
        turn: { title:"S-3 Plans changed \u00b7 currentStep 10.9", payloads:[ this.list("snakeiq_sc_plans_changed",
          "What has changed?", "Choose an option",
          [["False alarm","Cancel the hospital notification","sc_false_alarm"],
           ["Treating at home","Giving treatment at home","sc_home_care"],
           ["Other","Type what is happening","sc_other"]],
          false, false,
          "The full labels (\u201cFalse alarm, cancel hospital notification\u201d) exceed the 25-char quick-reply button limit, so S-3\u2019s options are sent as a list-picker: row titles \u2264 24 chars with the full wording in the description.") ] }
      };

      case "sc_false_alarm": return {
        msgs: [{ t:"bot", text:"I\u2019ve cancelled the notification to "+this.state.hospital+".\n\nIf any symptoms appear \u2014 swelling, dizziness, drooping eyelids, trouble breathing \u2014 message me straight away and we will start again." }],
        iact: null,
        turn: { title:"S-3 False alarm \u2014 notification cancelled", payloads:[ this.text("snakeiq_sc_false_alarm",
          "I\u2019ve cancelled the notification to "+this.state.hospital+". If any symptoms appear, message me straight away and we will start again.", "IS","\u2014") ] }
      };

      case "sc_home_care": return {
        msgs: [{ t:"bot", chip:["NOT RECOMMENDED","#C94B30","rgba(201,75,48,.12)"], text:"Snakebite cannot be treated at home. Antivenom is the only treatment and it can only be given in a hospital.\n\n\u2022 Do not use cutting, sucking, burning, or herbal remedies \u2014 they cause harm and lose time.\n\u2022 Symptoms can turn severe with no warning.\n\nI can keep the hospital on standby if you change your mind." }],
        iact: { t:"iact", kind:"qr", actions:[
          { title:"Go to hospital", next:"sc_enroute" },
          { title:"Stay home for now", next:"sc_home_ack" }
        ]},
        turn: { title:"S-3 Home treatment \u2014 harm reduction", payloads:[ this.qr("snakeiq_sc_home_care",
          "Snakebite cannot be treated at home. Antivenom is the only treatment and it can only be given in a hospital. Do not use cutting, sucking, burning, or herbal remedies.",
          [["Go to hospital","sc_home_go"],["Stay home for now","sc_home_stay"]], "IS","\u2014") ] }
      };

      case "sc_home_ack": return {
        msgs: [{ t:"bot", text:"Understood. I\u2019ll keep "+this.state.hospital+" on standby and check in again shortly.\n\nGo immediately if breathing becomes hard, speech slurs, eyelids droop, or swelling spreads." }],
        iact: null,
        turn: { title:"S-3 Staying home \u2014 standby + red flags", payloads:[ this.text("snakeiq_sc_home_ack",
          "I\u2019ll keep the hospital on standby and check in again shortly. Go immediately if breathing becomes hard, speech slurs, eyelids droop, or swelling spreads.", "IS","\u2014") ] }
      };

      case "sc_other": return {
        msgs: [{ t:"bot", text:"Tell me what is happening and I\u2019ll help from here." }],
        iact: { t:"iact", kind:"await", data:{ awaitText:true, other:true, hint:"Type what is happening\u2026" }},
        turn: { title:"S-3 Other \u2014 free text (edge of prototype)", payloads:[ this.text("snakeiq_sc_other",
          "Tell me what is happening and I\u2019ll help from here.", "IS","\u2014") ] }
      };

      case "sc_symptoms": {
        const rec = ID() ? ID().byId(this.state.species || "mamba_black") : null;
        const cyto = !!rec && (rec.syndromeClass === "cytotoxic" || rec.syndromeClass === "mixed");
        const pain = cyto ? { label:"Pain spreading up limb", sym:"sym_spread" }
                          : { label:"Pain at the bite", sym:"sym_local" };
        const body = "Which of these are happening now? Answer the first list if you were bitten, the second if you are with the victim.";
        const groups = [
          { label:"IF YOU WERE BITTEN \u2014 WHAT YOU FEEL", opts:[
            { label:"Numbness in face or lips", neuro:true, sym:"sym_ptosis" },
            { label:"Tingling hands or feet", neuro:true },
            { label:"Dizziness", neuro:true, sym:"sym_dizzy" },
            { label:"Nausea" },
            pain ] },
          { label:"IF YOU ARE WITH THE VICTIM \u2014 WHAT YOU SEE", opts:[
            { label:"Drooping eyelids", neuro:true, sym:"sym_ptosis" },
            { label:"Slurred speech", neuro:true, sym:"sym_ptosis" },
            { label:"Trouble swallowing", neuro:true, sym:"sym_ptosis" },
            { label:"Trouble breathing", sym:"sym_breath" },
            { label:"Swelling spreading fast", sym:"sym_spread" } ] }
        ];
        const opts = groups[0].opts.concat(groups[1].opts);
        const note = "One turn instead of two: the face-and-hands sensation question was a separate yes/no step, but it is the same clinical read as the rest of the checklist, so it is folded in. The split is by who can answer \u2014 a conscious victim reports sensations, a bystander reports signs \u2014 which also means a proxy never has to guess at numbness. WhatsApp lists are single-select and cap at 10 rows, so on the real channel this ships as the two lists shown here, sent in sequence, or as a deep link into the app. Pain is species-conditional: "
          + (cyto ? "cytotoxic venom (" + rec.commonName + ") gives severe, spreading local pain."
                  : "neurotoxic bites are often near-painless, so absence of pain is not reassurance.")
          + " Which row appears is decided from Seam B\u2019s syndromeClass, never by Design.";
        return {
          msgs: [{ t:"bot", text:body }],
          iact: { t:"iact", kind:"checklist", data:{ opts, groups, button:"Continue", none:"None of these", next:"sc_meds" }, reset:true },
          turn: { title:"S-4/S-5 Symptom checklist \u00b7 currentStep 11.5", payloads:[
            this.list("snakeiq_sc_symptoms_self", groups[0].label.split(" \u2014 ")[0] + ": which of these do you feel?", "Continue",
              groups[0].opts.map((o,k)=>[o.label, "", "sym_self_"+k]), false, true, note),
            this.list("snakeiq_sc_symptoms_proxy", groups[1].label.split(" \u2014 ")[0] + ": which of these do you see?", "Continue",
              groups[1].opts.map((o,k)=>[o.label, "", "sym_proxy_"+k]), false, true,
              "Second of the pair \u2014 sent only when a bystander is answering.")
          ]}
        };
      }

      // S-6 medications
      case "sc_meds": {
        const v = this.state.isVictim;
        const body = v ? "Have you taken any medications or herbal remedies since the bite?"
                       : "Has the victim taken any medications or herbal remedies since the bite?";
        return {
          msgs: [{ t:"bot", text:body }],
          iact: { t:"iact", kind:"qr", actions:[
            { title:"Yes", next:"sc_meds_which" },
            { title:"No", next:"sc_after_meds" }
          ]},
          turn: { title:"S-6 Medications \u00b7 currentStep 11.7", payloads:[ this.qr("snakeiq_sc_meds",
            body, [["Yes","sc_meds_yes"],["No","sc_meds_no"]], "IS","\u2014") ] }
        };
      }

      case "sc_meds_which": return {
        msgs: [{ t:"bot", text:"What medications or herbal remedies?" }],
        iact: { t:"iact", kind:"await", data:{ awaitText:true, hint:"Type the medication name\u2026" }},
        turn: { title:"S-6 Medication input \u00b7 currentStep 11.72", payloads:[ this.text("snakeiq_sc_meds_which",
          "What medications or herbal remedies?", "IS","\u2014") ] }
      };

      case "sc_meds_warn": return {
        msgs: [{ t:"bot", text:"Do not take any more medications or herbal remedies until you are seen by a doctor." }],
        iact: { t:"iact", kind:"qr", actions:[{ title:"Ok", next:"sc_after_meds" }]},
        turn: { title:"S-6 Medication warning", payloads:[ this.text("snakeiq_sc_meds_warn",
          "Do not take any more medications or herbal remedies until you are seen by a doctor.", "IS","\u2014") ] }
      };

      case "sc_after_meds":
        return this.buildState("sc_swelling");

      // S-7 runs after the swelling questions, and only when neuro was flagged
      case "sc_post_swelling":
        return this.buildState(this.state.hasNeuro ? "sc_neuro"
          : (this.state.swell ? "sc_mark" : "sc_sent"));

      case "sc_after_neuro":
        return this.buildState(this.state.swell ? "sc_mark" : "sc_sent");

      // S-7 conditional neurological warning
      case "sc_neuro": {
        const bound = sp.sid && /tourniquet|bandage/.test(String((ID() ? (ID().byId(sp.sid)||{}).firstAid : "") || ""));
        const limb = bound
          ? "\u2022 Do NOT loosen or remove the tourniquet or pressure bandage \u2014 early removal before antivenom risks a sudden bolus of venom.\n\u2022 Re-confirm the time it went on so ER knows how long it has been there (~4h practical limit).\n"
          : "\u2022 Do NOT bind or bandage the limb \u2014 for a "+sp.name+" bite it stays elevated and still.\n";
        const text = "Move the victim into the recovery position (left lateral) \u2014 not flat on their back \u2014 to protect the airway if paralysis progresses and to prevent aspiration if they vomit.\n\n\u2022 Nothing by mouth from this point on; if they were sipping water, stop.\n\u2022 Be ready to support breathing; keep dentures and food out of the mouth.\n"+limb+"\nI\u2019m re-sending your pre-alert to "+this.state.hospital+" flagged as neurotoxic progression, so they ready antivenom and an intubation kit.";
        return {
          msgs: [{ t:"bot", chip:["NEUROLOGICAL PROGRESSION DETECTED","#C94B30","rgba(201,75,48,.12)"], text }],
          iact: { t:"iact", kind:"qr", actions:[{ title:"Ok", next:"sc_after_neuro" }]},
          turn: { title:"S-7 Neurological warning (conditional, after the swelling checks)", payloads:[ this.text("snakeiq_sc_neuro_warning", text, "IS","\u2014") ] }
        };
      }

      // S-8 swelling check
      case "sc_swelling": {
        const v = this.state.isVictim;
        const body = v ? "Has swelling increased?" : "Has the victim\u2019s swelling increased?";
        return {
          msgs: [{ t:"bot", text:body }],
          iact: { t:"iact", kind:"qr", actions:[
            { title:"Yes", swell:true, next:"sc_post_swelling" },
            { title:"No", swell:false, next:"sc_post_swelling" }
          ]},
          turn: { title:"S-8 Swelling check \u00b7 currentStep 12", payloads:[ this.qr("snakeiq_sc_swelling",
            body, [["Yes","sc_swell_yes"],["No","sc_swell_no"]], "IS","\u2014") ] }
        };
      }

      // S-9 marking + photo
      case "sc_mark": {
        const v = this.state.isVictim;
        const mark = v ? "If you have a pen, draw a line around the current line of swelling and write the time on the line."
                       : "If you have a pen, draw a line around the current line of swelling on the victim and write the time on the line.";
        const rec3 = ID() ? ID().byId(this.state.species || "mamba_black") : null;
        const cls = rec3 ? rec3.syndromeClass : null;
        const siteNote = cls === "neurotoxic" || cls === "mixed"
          ? sp.name+" bites often leave only a tiny scratch, a pinpoint puncture, or nothing visible at all. This is NORMAL and does not mean the bite was harmless."
          : cls === "cytotoxic"
            ? "Include the edge of the swelling in the frame. Bruising and blistering build over hours, and the team will compare against this photo."
            : "A clear photo of the bite site helps the team at handover.";
        const photo = "Take a photo of the bite site.\n\n"+siteNote;
        return {
          msgs: [{ t:"bot", text:mark }, { t:"bot", text:photo }],
          iact: { t:"iact", kind:"qr", actions:[
            { title:"Take photo", echo:"[Photo]", next:"sc_sent_photo" },
            { title:"Skip", next:"sc_sent" }
          ]},
          turn: { title:"S-9 Swelling marking + photo \u00b7 currentStep 13.5", payloads:[
            this.text("snakeiq_sc_swelling_mark", mark, "IS","\u2014"),
            this.qr("snakeiq_sc_bite_photo", photo, [["Take photo","sc_photo"],["Skip","sc_photo_skip"]], "IS","\u2014")
          ]}
        };
      }

      case "sc_sent_photo": return {
        msgs: [{ t:"bot", text:"Good job! We are sending your update ahead to "+this.state.hospital+"." }],
        iact: this.buildState("sc_terminal").iact,
        turn: { title:"S-9 Photo sent \u2192 terminal", payloads:[
          this.text("snakeiq_sc_update_sent_photo", "Good job! We are sending your update ahead to "+this.state.hospital+".", "IS","\u2014"),
          this.buildState("sc_terminal").turn.payloads[0]
        ]}
      };

      case "sc_sent": return {
        msgs: [{ t:"bot", text:"We are sending your update ahead to "+this.state.hospital+"." }],
        iact: this.buildState("sc_terminal").iact,
        turn: { title:"S-9 Update sent \u2192 terminal", payloads:[
          this.text("snakeiq_sc_update_sent", "We are sending your update ahead to "+this.state.hospital+".", "IS","\u2014"),
          this.buildState("sc_terminal").turn.payloads[0]
        ]}
      };

      // T-1 terminal card
      case "sc_terminal": {
        const sp = SP(this.state.species || "mamba_black");
        const rows = [
          { title:"My bite information", desc:"Snake, time, location, hospital, vials", next:"sc_bite_info", echo:"My bite information" },
          { title:"Treatment for "+sp.name, desc:"WHO protocol in plain language", next:"sc_treatment", echo:"Treatment for "+sp.name },
          { title:"I have checked into the ER", desc:"Hand over to the medical team", next:"sc_checked_in", echo:"I have checked into the ER" },
          { title:"Find a different hospital", desc:"See other facilities near you", next:"sc_hosp_list", echo:"Find a different hospital" }
        ];
        return {
          msgs: [],
          iact: { t:"iact", kind:"list", data:{ map:false, button:"Menu", menuTop:true, rows }},
          turn: { title:"T-1 Terminal card \u00b7 currentStep 14", payloads:[ this.list("snakeiq_sc_terminal",
            "Nothing else is needed from you. The menu stays open if you need it.", "Menu",
            rows.map(r=>[r.title, r.desc, "sc_"+r.next]), false, false,
            "Four persistent actions do not fit a quick-reply (\u2264 3 buttons), so T-1 is sent as a list-picker, which carries up to 10 rows. The button reads \u201cMenu\u201d and sits above the rows so the turn closes the flow rather than asking for another decision \u2014 nothing here is required of the victim.") ] }
        };
      }

      case "sc_treatment": {
        const sp = SP(this.state.species || "mamba_black");
        return {
          msgs: [{ t:"bot", text:"Treatment guidance for a "+sp.name+" bite is prepared for the hospital team \u2014 the full WHO protocol in plain language is the next piece to build." }],
          iact: this.buildState("sc_terminal").iact,
          turn: { title:"T-1 Treatment \u2014 edge of prototype", payloads:[ this.text("snakeiq_sc_treatment",
            "Treatment guidance for a "+sp.name+" bite is prepared for the hospital team.", "IS","\u2014") ] }
        };
      }

      case "sc_bite_info": {
        const sp = SP(this.state.species || "mamba_black");
        const body = sp.name+" \u00b7 bite reported 14:24\n"+this.state.hospital+" \u00b7 8.7 km \u00b7 142 vials\nLocation shared \u00b7 Hhohho, Eswatini";
        return {
          msgs: [],
          iact: { t:"iact", kind:"card", data:{ title:"Bite information", body, tag:null },
            actions:[
              { title:"Text", echo:"Shared by text", next:"sc_terminal" },
              { title:"Email", echo:"Shared by email", next:"sc_terminal" },
              { title:"Save to device", echo:"Saved to device", next:"sc_terminal" }
            ]},
          turn: { title:"T-1 Bite info summary", payloads:[ this.card("snakeiq_sc_bite_info", "Bite information", body,
            [["Text","sc_share_text","QUICK_REPLY"],["Email","sc_share_email","QUICK_REPLY"],["Save to device","sc_share_save","QUICK_REPLY"]], {}) ] }
        };
      }

      case "sc_checked_in": return {
        msgs: [{ t:"bot", text:"The medical team will take care of you now." }],
        iact: null,
        turn: { title:"T-1 Checked into ER \u2014 flow ends", payloads:[ this.text("snakeiq_sc_checked_in",
          "The medical team will take care of you now.", "IS","\u2014") ] }
      };

      default: return { msgs:[{t:"bot",text:"(end of prototyped path)"}], iact:null, turn:this.state.turn };
    }
  }

  // ---------- payload factory ----------
  qr(fn, body, actions, session, approval, note){
    return { friendly_name:fn, content_type:"twilio/quick-reply", session, approval, note,
      limit:"\u2264 3 buttons \u00b7 title \u2264 25 chars (WhatsApp)",
      json:{ friendly_name:fn, language:"en", types:{ "twilio/quick-reply":{ body,
        actions: actions.map(a=>({ id:a[1], title:a[0] })) } } },
      checks: this.mkChecks(actions.map(a=>({ label:'action "'+a[0]+'"', len:a[0].length, limit:25 }))) };
  }
  checklist(fn, body, opts, note){
    return { friendly_name:fn, content_type:"twilio/list-picker (multi-select emulated)", session:"IS", approval:"\u2014",
      limit:"WhatsApp has NO multi-select \u00b7 emulated as repeated list-picker or free text",
      json:{ friendly_name:fn, language:"en", types:{ "twilio/list-picker":{ body, button:"Continue",
        items: opts.map((o,k)=>({ item:o.label, id:"sym_"+k, description:o.neuro?"neurological indicator":"" })) } } },
      note: note,
      checks: this.mkChecks(opts.map(o=>({ label:'item "'+o.label+'"', len:o.label.length, limit:24 }))) };
  }
  qrTmpl(fn, body, actions, variables){
    return { friendly_name:fn, content_type:"twilio/quick-reply (template)", session:"OOS", approval:"REQ",
      limit:"\u2264 3 buttons \u00b7 title \u2264 25 \u00b7 pre-approved template required",
      json:{ friendly_name:fn, language:"en", variables, types:{ "twilio/quick-reply":{ body,
        actions: actions.map(a=>({ id:a[1], title:a[0] })) } } },
      checks: this.mkChecks(actions.map(a=>({ label:'action "'+a[0]+'"', len:a[0].length, limit:25 }))) };
  }
  timeq(fn, body){
    return { friendly_name:fn, content_type:"twilio/text \u00b7 time reply", session:"IS", approval:"\u2014",

    }

/* Presentation for the module's key options: swatches, place icons, marking
   sketches, and spelled-out lengths. The module owns the questions and values;
   Design owns how they look. */
const KEY_LABEL = {
  key_size: { tiny:"Under 30 centimetres", small:"Under 1 metre", medium:"1 to 2 metres",
    large:"Over 2 metres", any:"Not sure" }
};
const KEY_BUTTON = { key_size:"" };   // the prompt already says to choose a length
const SWATCH = { dark:"#1b1b1b", brown:"#8a5a2b", green:"#4a7c3f", grey:"#8c9196",
  yellow:"#c9a227", red:"#9c3b2a", olive:"#6c6f3f", cream:"#e0d3ba" };
function keyVisual(qid, v){
  const h = React.createElement;
  const box = (kids, extra) => h("div",{ style:{ width:22, height:22, borderRadius:4, border:"1px solid rgba(0,0,0,.18)", overflow:"hidden", ...(extra||{}) } }, kids);
  const svg = (kids) => h("svg",{ width:22, height:22, viewBox:"0 0 24 24", fill:"none" }, kids);
  if (qid === "key_colour"){
    if (v === "banded") return box(null, { background:"repeating-linear-gradient(135deg,#3a2d22 0 4px,#d8c9a8 4px 8px)" });
    if (v === "other") return box(null, { background:"conic-gradient(#8a5a2b,#4a7c3f,#8c9196,#1b1b1b,#8a5a2b)" });
    if (v === "any") return null;
    return SWATCH[v] ? box(null, { background:SWATCH[v] }) : null;
  }
  if (qid === "key_habitat"){
    const st = { stroke:"#447687", strokeWidth:1.8, strokeLinecap:"round", strokeLinejoin:"round" };
    if (v === "water") return svg([h("path",{ key:1, d:"M2 14c3-3 5-3 8 0s5 3 8 0", ...st }), h("path",{ key:2, d:"M2 19c3-3 5-3 8 0s5 3 8 0", ...st })]);
    if (v === "tree") return svg([h("path",{ key:1, d:"M12 20v-5", ...st }), h("path",{ key:2, d:"M12 3l5 8H7l5-8zM12 8l4 7H8l4-7z", ...st })]);
    if (v === "grass") return svg([h("path",{ key:1, d:"M12 21c0-5 1-8 3-11M12 21c0-5-1-8-3-11M12 21c0-4 3-7 6-9M12 21c0-4-3-7-6-9", ...st })]);
    if (v === "rocky") return svg([h("path",{ key:1, d:"M2 19l6-9 4 5 3-4 7 8H2z", ...st })]);
    if (v === "building") return svg([h("path",{ key:1, d:"M4 20V9l8-5 8 5v11", ...st }), h("path",{ key:2, d:"M10 20v-6h4v6", ...st })]);
    if (v === "underground") return svg([h("path",{ key:1, d:"M2 10h20", ...st }), h("path",{ key:2, d:"M6 10c0 4 3 6 6 6s6-2 6-6", ...st }), h("path",{ key:3, d:"M4 6l3 2M12 5v3M20 6l-3 2", ...st })]);
    return null;
  }
  if (qid === "key_hood"){
    const st = { stroke:"#11344F", strokeWidth:1.6, strokeLinecap:"round", strokeLinejoin:"round" };
    const head = [
      h("path",{ key:"h", d:"M12 1.8c-2 0-3.4 1.5-3.4 3.3 0 2.2 1.5 4.2 3.4 5.9 1.9-1.7 3.4-3.7 3.4-5.9 0-1.8-1.4-3.3-3.4-3.3z", ...st }),
      h("circle",{ key:"e1", cx:10.7, cy:5.2, r:.75, fill:"#11344F" }),
      h("circle",{ key:"e2", cx:13.3, cy:5.2, r:.75, fill:"#11344F" })];
    if (v === "hood") return svg(head.concat([
      h("path",{ key:1, d:"M8.6 4c-3.4 1.1-5.6 3.7-5.6 6.6 0 2.7 2.2 4.8 5.3 5.9", ...st }),
      h("path",{ key:2, d:"M15.4 4c3.4 1.1 5.6 3.7 5.6 6.6 0 2.7-2.2 4.8-5.3 5.9", ...st }),
      h("path",{ key:3, d:"M12 11c-.4 2.6.7 4.2-.2 6.4", ...st }),
      h("path",{ key:4, d:"M11.8 17.4c-2.6-.5-4.6.3-4.6 1.7 0 1.3 2 2 4.3 2h3.2", ...st })]));
    if (v === "raised") return svg(head.concat([
      h("path",{ key:1, d:"M12 11c-.6 2.3.8 3.7-.3 5.8", ...st }),
      h("path",{ key:2, d:"M11.7 16.8c-4-.8-7.5.5-7.5 2.3 0 1.4 2.2 2.1 5 2.1 3.3 0 5.9-.8 8.3-2.1", ...st })]));
    return null;   // “Neither” gets no illustration
  }
  if (qid === "key_pattern"){
    const st = { stroke:"#11344F", strokeWidth:1.7, strokeLinecap:"round", strokeLinejoin:"round" };
    if (v === "geometric") return svg([h("path",{ key:1, d:"M4 8l4 4 4-4 4 4 4-4M4 16l4 4 4-4 4 4 4-4", ...st })]);
    if (v === "blotched") return svg([h("circle",{ key:1, cx:8, cy:8, r:2.6, fill:"#11344F" }), h("circle",{ key:2, cx:16, cy:11, r:3.2, fill:"#11344F" }), h("circle",{ key:3, cx:9, cy:17, r:2.2, fill:"#11344F" })]);
    return null;   // \u201cplain\u201d gets no illustration
  }
  return null;
}

/* =====================================================================
   Design-side data. The species table, the key, the ranking, confidence,
   antivenom and the alert cadence all live in the MODULE (snakeiq-id-module.js,
   loaded from species.csv). Nothing clinical is computed here.
   ===================================================================== */
const SESSION_ID = "wa_268_7612xxxx_4831";
const CHAT_START_MIN = 14*60 + 34;   // the session's own clock, shown in the status bar
const ID_PROMPT_COPY = "Photo ID is the best way to see if a snake is venomous. Only take a photo if you can keep a safe distance.";
const ID = () => window.SnakeIQID;

/* Photo-ID is the module's other entry point; its ranked matches are stubbed
   here because the vision model isn't part of this prototype. Confidence is
   shown only on this path, and only at the choice point.

   The numbers are shaped like a real classifier's output over one image, not
   four independent scores: they are a distribution (0.99 here, the remaining
   0.01 spread across the other 57 species in the set), so they fall away
   steeply instead of clustering in the 80s. The Mozambique spitting cobra is
   the one real contender \u2014 a slender grey-olive snake photographed at distance
   genuinely confuses the two elapids \u2014 while the stout patterned puff adder
   and the blotched python are poor matches for the same silhouette and score
   accordingly. Only the top candidate clears the 80% LOW CONFIDENCE threshold,
   so the chip appears on the three alternates and the ranking still carries a
   clear leader. */
const MOCK_PHOTO_MATCHES = [["mamba_black",0.86],["cobra_mozam",0.09],["adder_puff",0.03],["python_southern",0.02]];

/* Immobilisation wording per the module's species-specific firstAid value
   (guideline Annex 6). Design owns the words, the module owns which one. */
const IMMOB = {
  "broad-tourniquet": "Apply a broad tourniquet above the bite \u2014 for this species only.",
  "pressure-bandage": "Apply a firm pressure bandage over the bite and immobilise the limb.",
  "elevation": "Elevate the limb. Do NOT apply a tourniquet or pressure bandage.",
  "limb-below-heart": "Keep the bitten limb still and below heart level.",
  "none": "Keep the bitten limb still."
};

// Display adapter over the module's species record — presentation only.
const SP = (id) => {
  const m = ID(), s = m ? m.byId(id) : null;
  if (!s) return { sid:id, name:"Unknown snake", sci:"", status:"Unknown", venom:true, fast:false,
    about:"", interval:240, immob:IMMOB.none, care:"emergency", tier:"deadly", av:null };
  return { sid:s.speciesId, name:s.commonName, sci:s.scientificName, status:s.venomStatusLabel,
    venom: s.venomStatus === "venomous", fast: s.alertIntervalMin <= 10, about: s.notes,
    interval: s.alertIntervalMin, immob: IMMOB[s.firstAid] || IMMOB.none,
    av: s.antivenom, tier: s.tier, care: s.careLevel };
};
